services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pedagogy_db
    environment:
      POSTGRES_USER: pedagogy
      POSTGRES_PASSWORD: pedagogy_secret
      POSTGRES_DB: pedagogy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedagogy -d pedagogy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
